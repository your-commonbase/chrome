<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Screenshot - YCB</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2a2a2a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
        
        .btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        .crop-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: calc(100vh - 200px);
            overflow: auto;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
        }
        
        .crop-image {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        
        .crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .crop-selection {
            position: absolute;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            cursor: move;
            pointer-events: all;
        }
        
        .crop-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border: 1px solid #fff;
            pointer-events: all;
            cursor: pointer;
        }
        
        .crop-handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
        .crop-handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
        .crop-handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
        .crop-handle.se { bottom: -4px; right: -4px; cursor: se-resize; }
        .crop-handle.n { top: -4px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .crop-handle.s { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .crop-handle.w { top: 50%; left: -4px; transform: translateY(-50%); cursor: w-resize; }
        .crop-handle.e { top: 50%; right: -4px; transform: translateY(-50%); cursor: e-resize; }
        
        .instructions {
            text-align: center;
            margin-bottom: 15px;
            color: #ccc;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #ccc;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            font-size: 16px;
        }
        
        .comment-section {
            margin-top: 20px;
            padding: 0 10px;
        }
        
        .comment-label {
            display: block;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .comment-input {
            width: 100%;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 8px;
            color: white;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            min-height: 60px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        .comment-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        
        .comment-input::placeholder {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Crop Screenshot</div>
        <div class="buttons">
            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button class="btn btn-primary" id="saveBtn" disabled>Save to YCB</button>
        </div>
    </div>
    
    <div class="instructions">
        Click and drag to select the area you want to save. Use the handles to adjust the selection.
    </div>
    
    <div class="crop-container" id="cropContainer">
        <div class="loading" id="loading">Loading screenshot...</div>
    </div>
    
    <div class="comment-section">
        <label for="commentBox" class="comment-label">Add an optional comment (takes up to 1 minute to save):</label>
        <textarea 
            id="commentBox" 
            class="comment-input" 
            placeholder="Describe what this screenshot shows or why you're saving it..."
            rows="3"
        ></textarea>
    </div>

</body>
</html>
